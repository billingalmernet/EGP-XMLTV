<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Instant M3U to XMLTV VOD Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 200px; margin-top: 10px; font-family: monospace; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; width: 100%; }
        button:hover { background: #0056b3; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h2>VOD XMLTV EPG Generator</h2>
        <p>Buka URL M3U Anda di browser, lalu <b>Copy (Salin)</b> semua teks isi M3U tersebut dan <b>Paste (Tempel)</b> ke kotak di bawah ini:</p>
        <textarea id="m3uInput" placeholder="#EXTM3U ... paste teks M3U Anda di sini"></textarea>
        <button onclick="generateXMLTV()">Konversi & Download XML TV</button>
    </div>

    <script>
        function generateXMLTV() {
            const m3uText = document.getElementById('m3uInput').value;
            if(!m3uText.trim()){ alert("Silakan paste isi file M3U terlebih dahulu!"); return; }

            let startTime = "20260101000000 +0700";
            let stopTime = "20350101000000 +0700";

            let channels = "";
            let programmes = "";
            let count = 0;

            // Regex untuk membaca baris tag EXTM3U
            const pattern = /#EXTINF:[^,\n]*(?:tvg-id="([^"]*)")?[^,\n]*(?:tvg-logo="([^"]*)")?[^,\n]*(?:group-title="([^"]*)")?[^,\n]*,([^\n]+)\n([^\n#]+)/g;
            let match;

            while ((match = pattern.exec(m3uText)) !== null) {
                let tvgId = match[1] ? match[1].trim() : "";
                let tvgLogo = match[2] ? match[2].trim() : "";
                let groupTitle = match[3] ? match[3].trim() : "VOD";
                let title = match[4] ? match[4].strip ? match[4].strip() : match[4].trim() : "Unknown Movie";

                if (!tvgId) {
                    tvgId = title.toLowerCase().replace(/[^a-z0-9]/g, ".");
                }

                // Buat struktur XML
                channels += `  <channel id="${tvgId}">\n`;
                channels += `    <display-name lang="id">${title}</display-name>\n`;
                if(tvgLogo) channels += `    <icon src="${tvgLogo}" />\n`;
                channels += `  </channel>\n`;

                programmes += `  <programme start="${startTime}" stop="${stopTime}" channel="${tvgId}">\n`;
                programmes += `    <title lang="id">${title}</title>\n`;
                programmes += `    <desc lang="id">Kategori: ${groupTitle}. Video on-demand siap ditonton kapan saja.</desc>\n`;
                programmes += `    <category lang="id">${groupTitle}</category>\n`;
                programmes += `  </programme>\n`;
                
                count++;
            }

            if(count === 0) {
                alert("Format M3U tidak dikenali atau tidak ada film yang ditemukan. Pastikan teks diawali dengan #EXTM3U");
                return;
            }

            let xmlContent = `<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE tv SYSTEM "xmltv.dtd">\n<tv generator-info-name="VOD Converter">\n\n<!-- DAFTAR KATALOG VOD -->\n${channels}\n<!-- METADATA VOD -->\n${programmes}\n</tv>`;

            // Proses Download File Otomatis
            let blob = new Blob([xmlContent], { type: "text/xml" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "vod_guide.xml";
            link.click();
            alert("Selesai! Berhasil mengonversi " + count + " item VOD. File 'vod_guide.xml' telah diunduh.");
        }
    </script>
</body>
</html>
